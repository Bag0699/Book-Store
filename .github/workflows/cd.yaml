name: Despliegue a Producción (Sin Docker)
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Login con DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Construir y subir imagen a DockerHub
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/bookstore:latest
    - name: Desplegar en Render
      run: |
        # Si la URL no es nula, hacemos la petición
        if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Disparo de despliegue enviado a Render."
        else
          echo "Advertencia: No se ha configurado el secreto RENDER_DEPLOY_HOOK."
        fi