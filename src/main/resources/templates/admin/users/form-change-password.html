<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <title>Cambiar Contraseña</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="mt-4">Cambiar Contraseña</h1>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Formulario de Cambio de Contraseña</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/users/update_password}" th:object="${passwordForm}" method="post">

                <input type="hidden" th:field="*{userId}"/> <div class="mb-3">
                <label for="newPassword" class="form-label">Nueva Contraseña:</label>
                <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}"
                       th:errorclass="is-invalid" required>
                <div class="invalid-feedback" th:errors="*{newPassword}"></div>
            </div>

                <div class="mb-3">
                    <label for="confirmNewPassword" class="form-label">Confirmar Nueva Contraseña:</label>
                    <input type="password" class="form-control" id="confirmNewPassword" th:field="*{confirmPassword}"
                           th:errorclass="is-invalid" required>
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <a th:href="@{/admin/users}" class="btn btn-secondary me-2">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-key"></i> Cambiar Contraseña
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="page-css"></th:block>
<th:block layout:fragment="page-js"></th:block>
</body>
</html>
