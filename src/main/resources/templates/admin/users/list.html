<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <title>Administración de Usuarios</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="mt-4">Gestión de Usuarios</h1>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="lead">Aquí puedes ver y gestionar todos los usuarios registrados.</p>
        <a th:href="@{/admin/users/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Nuevo Usuario
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Lista de Usuarios</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-striped">
                    <thead class="bg-light text-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Usuario</th>
                        <th scope="col">Email</th>
                        <th scope="col">Rol</th>
                        <th scope="col">Acciones</th> </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.fullName}">John Doe</td>
                        <td th:text="${user.username}">johndoe</td>
                        <td th:text="${user.email}">john.doe@example.com</td>
                        <td th:text="${user.role}">Administrador</td>
                        <td>
                            <a th:href="@{/admin/users/edit/{id}(id=${user.id})}"
                               class="btn btn-sm btn-primary me-2">
                                <i class="bi bi-pencil-square"></i> Editar
                            </a>
                            <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post"
                                  style="display:inline;"
                                  onsubmit="return confirm('¿Estás seguro de que quieres eliminar a este usuario?');">
                                <button type="submit" class="btn btn-sm btn-danger">
                                    <i class="bi bi-trash"></i> Eliminar
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${users.isEmpty()}">
                        <td colspan="6" class="text-center text-muted">No hay usuarios registrados.</td> </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="page-js"></th:block>
</body>
</html>
