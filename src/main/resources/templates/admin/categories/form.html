<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <title th:text="${category.id} ? 'Editar Categoría' : 'Nueva Categoría'">Formulario de Categoría</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="mt-4" th:text="${category.id} ? 'Editar Categoría' : 'Crear Nueva Categoría'"></h1>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0" th:text="${category.id} ? 'Formulario de Edición' : 'Formulario de Creación'"></h5>
        </div>
        <div class="card-body">
            <form th:unless="${category.id != null}" th:action="@{/admin/categories/save}" th:object="${category}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label for="name" class="form-label">Nombre de la Categoría:</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}"
                           th:errorclass="is-invalid" placeholder="Ej. Novela, Ciencia Ficción" required>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Descripción de la Categoría:</label>
                    <textarea class="form-control" id="description" th:field="*{description}"
                              th:errorclass="is-invalid" rows="5" placeholder="Breve descripción de la categoria..."></textarea>
                    <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <a th:href="@{/admin/categories}" class="btn btn-secondary me-2">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Guardar Categoría
                    </button>
                </div>
            </form>
            <form th:if="${category.id != null}" th:action="@{'/admin/categories/update/' + ${category.id}}" th:object="${category}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label for="name" class="form-label">Nombre de la Categoría:</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}"
                           th:errorclass="is-invalid" placeholder="Ej. Novela, Ciencia Ficción" required>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Descripción de la Categoría:</label>
                    <textarea class="form-control" id="description" th:field="*{description}"
                              th:errorclass="is-invalid" rows="5" placeholder="Breve descripción de la categoria..."></textarea>
                    <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <a th:href="@{/admin/categories}" class="btn btn-secondary me-2">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Guardar Categoría
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="page-css"></th:block>
<th:block layout:fragment="page-js"></th:block>
</body>
</html>
