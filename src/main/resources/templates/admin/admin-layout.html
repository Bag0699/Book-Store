<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title="'Admin Panel de Control'"></title>
    <link rel="shortcut icon" th:href="@{/img/logo-favicon.ico}"type="image/x-x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <th:block layout:fragment="page-css"></th:block>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">
            <img src="/img/logo.png" alt="Admin Logo" style="height: 40px; margin-right: 10px;">
            Panel de Administrador
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle"></i> Admin
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="#">Perfil</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/logout">Cerrar Sesión</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/">Ir a la Tienda</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="d-flex" id="wrapper">
    <div class="bg-light border-right" id="sidebar-wrapper">
        <div class="sidebar-heading bg-primary text-white py-3 px-4">Gestión</div>
        <div class="list-group list-group-flush">
            <a th:href="@{/admin/dashboard}" class="list-group-item list-group-item-action bg-light">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a th:href="@{/admin/books}" class="list-group-item list-group-item-action bg-light">
                <i class="bi bi-book"></i> Libros
            </a>
            <a th:href="@{/admin/users}" class="list-group-item list-group-item-action bg-light">
                <i class="bi bi-people"></i> Usuarios
            </a>
            <a th:href="@{/admin/categories}" class="list-group-item list-group-item-action bg-light">
                <i class="bi bi-tags"></i> Categorías
            </a>
            <a th:href="@{/admin/authors}" class="list-group-item list-group-item-action bg-light">
                <i class="bi bi-pencil-square"></i> Autores
            </a>
            <a th:href="@{/admin/editorials}" class="list-group-item list-group-item-action bg-light">
                <i class="bi bi-building"></i> Editoriales
            </a>
            <a th:href="@{/admin/formats}" class="list-group-item list-group-item-action bg-light">
                <i class="bi bi-file-earmark"></i> Formatos
            </a>
            <a th:href="@{/api/orders/list}" class="list-group-item list-group-item-action bg-light">
                <i class="bi bi-receipt"></i> Órdenes
            </a>
            <a th:href="@{/admin/stores}" class="list-group-item list-group-item-action bg-light">
                <i class="bi bi-shop"></i> Tiendas
            </a>
        </div>
    </div>

    <div id="page-content-wrapper">
        <div class="container-fluid py-4">
            <th:block layout:fragment="content"></th:block>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<script th:src="@{/js/admin-common.js}"></script>

<th:block layout:fragment="page-js"></th:block>

</body>
</html>
