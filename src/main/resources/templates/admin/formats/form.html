<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
  <title th:text="${format.id} ? 'Editar Formato' : 'Nuevo Formato'">Formulario de Formato</title>
</head>
<body>
<div layout:fragment="content">
  <h1 class="mt-4" th:text="${format.id} ? 'Editar Formato' : 'Crear Nuevo Formato'"></h1>

  <div class="card shadow-sm mb-4">
    <div class="card-header bg-dark text-white">
      <h5 class="mb-0" th:text="${format.id} ? 'Formulario de Edición' : 'Formulario de Creación'"></h5>
    </div>
    <div class="card-body">
      <form th:unless="${format.id != null}" th:action="@{/admin/formats/save}" th:object="${format}" method="post">

        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
          <label for="name" class="form-label">Nombre del Formato:</label>
          <input type="text" class="form-control" id="name" th:field="*{name}"
                 th:errorclass="is-invalid" placeholder="Ej. Tapa Dura, Ebook, Audiolibro" required>
          <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="d-flex justify-content-end mt-4">
          <a th:href="@{/admin/formats}" class="btn btn-secondary me-2">
            <i class="bi bi-x-circle"></i> Cancelar
          </a>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> Guardar Formato
          </button>
        </div>
      </form>

      <form th:if="${format.id != null}" th:action="@{'/admin/formats/update/' + ${format.id}}"
            th:object="${format}" method="post">

        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
          <label for="nameEdit" class="form-label">Nombre del Formato:</label>
          <input type="text" class="form-control" id="nameEdit" th:field="*{name}"
                 th:errorclass="is-invalid" placeholder="Ej. Tapa Dura, Ebook, Audiolibro" required>
          <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="d-flex justify-content-end mt-4">
          <a th:href="@{/admin/formats}" class="btn btn-secondary me-2">
            <i class="bi bi-x-circle"></i> Cancelar
          </a>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> Guardar Formato
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<th:block layout:fragment="page-css"></th:block>
<th:block layout:fragment="page-js"></th:block>
</body>
</html>
