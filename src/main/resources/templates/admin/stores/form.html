<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <title th:text="${store.id} ? 'Editar Tienda' : 'Nueva Tienda'">Formulario de Tienda</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="mt-4" th:text="${store.id} ? 'Editar Tienda' : 'Crear Nueva Tienda'"></h1>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0" th:text="${store.id} ? 'Formulario de Edición' : 'Formulario de Creación'"></h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/stores/save}" th:object="${store}" method="post">

                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="name" class="form-label">Sede de la Tienda:</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}"
                           th:errorclass="is-invalid" placeholder="Ej. Sede Surco" required>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Dirección:</label>
                    <input type="text" class="form-control" id="address" th:field="*{address}"
                           th:errorclass="is-invalid" placeholder="Ej. Calle Falsa 123" required>
                    <div class="invalid-feedback" th:errors="*{address}"></div>
                </div>

                <div class="mb-3">
                    <label for="attention" class="form-label">Atención:</label>
                    <input type="text" class="form-control" id="attention" th:field="*{attention}"
                           th:errorclass="is-invalid" placeholder="Ej. Lunes a sábado: 8:00 a.m. – 8:00 p.m." required>
                    <div class="invalid-feedback" th:errors="*{attention}"></div>
                </div>
                <div class="mb-3">
                    <label for="map" class="form-label">Url del Mapa:</label>
                    <input type="text" class="form-control" id="map" th:field="*{map}"
                           th:errorclass="is-invalid" placeholder="Ej. https://maps.google.com/maps?q=Av.+Caminos+del+Inca+2570,+Surco,+Lima&output=embed" required>
                    <div class="invalid-feedback" th:errors="*{map}"></div>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <a th:href="@{/admin/stores}" class="btn btn-secondary me-2">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Guardar Tienda
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="page-css"></th:block>
<th:block layout:fragment="page-js"></th:block>
</body>
</html>
