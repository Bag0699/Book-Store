<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
  <title th:text="${bookNew.id} ? 'Editar Libro' : 'Nuevo Libro'">Formulario de Libro</title>
  <title>Nuevo Libro</title>
</head>
<body>
<div layout:fragment="content">
  <h1 class="mt-4" th:text="${bookNew.id} ? 'Editar Libro' : 'Crear Nuevo Libro'"></h1>

  <div class="card shadow-sm mb-4">
    <div class="card-header bg-dark text-white">
      <h5 class="mb-0" th:text="${bookNew.id} ? 'Formulario de Edición' : 'Formulario de Creación'"></h5>
    </div>
    <div class="card-body">
      <form th:action="@{/admin/books/save}" th:object="${bookNew}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
          <label for="title" class="form-label">Título del Libro:</label>
          <input type="text" class="form-control" id="title" th:field="*{title}"
                 th:errorclass="is-invalid" placeholder="Ej. Cien años de soledad" required>
          <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>

        <div class="mb-3">
          <label for="author" class="form-label">Autor:</label>
          <select class="form-select" id="author" th:field="*{authorId}" th:errorclass="is-invalid" required>
            <option value="">Selecciona un autor</option>
            <option th:each="auth : ${allAuthors}"
                    th:value="${auth.id}"
                    th:text="${auth.name}"
                    th:selected="${bookNew.authorId== auth.id}">
              Autor Nombre
            </option>
          </select>
          <div class="invalid-feedback" th:errors="*{authorId}"></div>
        </div>

        <div class="mb-3">
          <label for="category" class="form-label">Categoría:</label>
          <select class="form-select" id="category" th:field="*{categoryId}" th:errorclass="is-invalid" required>
            <option value="">Selecciona una categoría</option>
            <option th:each="cat : ${allCategories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}"
                    th:selected="${bookNew.categoryId== cat.id}">
              Categoría Nombre
            </option>
          </select>
          <div class="invalid-feedback" th:errors="*{categoryId}"></div>
        </div>

        <div class="mb-3">
          <label for="editorial" class="form-label">Editorial:</label>
          <select class="form-select" id="editorial" th:field="*{editorialId}" th:errorclass="is-invalid"
                  required>
            <option value="">Selecciona una editorial</option>
            <option th:each="edit : ${allEditorials}"
                    th:value="${edit.id}"
                    th:text="${edit.name}"
                    th:selected="${bookNew.editorialId== edit.id}">
              Editorial Nombre
            </option>
          </select>
          <div class="invalid-feedback" th:errors="*{editorialId}"></div>
        </div>

        <div class="mb-3">
          <label for="format" class="form-label">Formato:</label>
          <select class="form-select" id="format" th:field="*{formatId}" th:errorclass="is-invalid" required>
            <option value="">Selecciona un formato</option>
            <option th:each="form : ${allFormats}"
                    th:value="${form.id}"
                    th:text="${form.name}"
                    th:selected="${bookNew.formatId== form.id}">
              Formato Nombre
            </option>
          </select>
          <div class="invalid-feedback" th:errors="*{formatId}"></div>
        </div>

        <div class="mb-3">
          <label for="isbn" class="form-label">ISBN:</label>
          <input type="text" class="form-control" id="isbn" th:field="*{isbn}"
                 th:errorclass="is-invalid" placeholder="Ej. 978-84-663-3627-8" required>
          <div class="invalid-feedback" th:errors="*{isbn}"></div>
        </div>

        <div class="mb-3">
          <label for="dimension" class="form-label">Dimensión:</label>
          <input type="text" class="form-control" id="dimension" th:field="*{dimension}"
                 th:errorclass="is-invalid" placeholder="Ej. 25x12cm" required>
          <div class="invalid-feedback" th:errors="*{dimension}"></div>
        </div>

        <div class="mb-3">
          <label for="price" class="form-label">Precio:</label>
          <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}"
                 th:errorclass="is-invalid" placeholder="Ej. 25.99" required>
          <div class="invalid-feedback" th:errors="*{price}"></div>
        </div>

        <div class="mb-3">
          <label for="stock" class="form-label">Stock:</label>
          <input type="number" class="form-control" id="stock" th:field="*{stock}"
                 th:errorclass="is-invalid" placeholder="Ej. 100" required>
          <div class="invalid-feedback" th:errors="*{stock}"></div>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Descripción:</label>
          <textarea class="form-control" id="description" th:field="*{description}"
                    th:errorclass="is-invalid" rows="5" placeholder="Breve descripción del libro..."></textarea>
          <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>

        <div class="mb-3">
          <label for="sinopsis" class="form-label">Sinopis:</label>
          <textarea class="form-control" id="sinopsis" th:field="*{sinopsis}"
                    th:errorclass="is-invalid" rows="5" placeholder="Breve sinopsis del libro..."></textarea>
          <div class="invalid-feedback" th:errors="*{sinopsis}"></div>
        </div>

        <div class="mb-3">
          <label for="urlImg" class="form-label">URL de la Portada:</label>
          <input type="text" class="form-control" id="urlImg" th:field="*{urlImg}"
                 th:errorclass="is-invalid" placeholder="Ej. /img/tokio-blues.webp">
          <div class="invalid-feedback" th:errors="*{urlImg}"></div>
        </div>

<!--        <div th:if="${book.urlImg != null and !book.urlImg.isEmpty()}" class="mb-3">-->
<!--          <label class="form-label">Vista Previa de la Portada:</label>-->
<!--          <div class="d-block">-->
<!--            <img th:src="${book.urlImg}" alt="Portada del Libro"-->
<!--                 style="max-width: 200px; height: auto; border: 1px solid #ddd; padding: 5px;">-->
<!--          </div>-->
<!--        </div>-->

        <div class="d-flex justify-content-end mt-4">
          <a th:href="@{/admin/books}" class="btn btn-secondary me-2">
            <i class="bi bi-x-circle"></i> Cancelar
          </a>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> Guardar Libro
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<th:block layout:fragment="page-css"></th:block>
<th:block layout:fragment="page-js"></th:block>
</body>
</html>
