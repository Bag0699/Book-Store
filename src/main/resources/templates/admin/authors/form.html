<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/admin-layout}">
<head>
    <title th:text="${author.id} ? 'Editar Autor' : 'Nuevo Autor'">Formulario de Autor</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="mt-4" th:text="${author.id} ? 'Editar Autor' : 'Crear Nuevo Autor'"></h1>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0" th:text="${author.id} ? 'Formulario de Edición' : 'Formulario de Creación'"></h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/authors/save}" th:object="${author}" method="post">

                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="name" class="form-label">Nombre del Autor:</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}"
                           th:errorclass="is-invalid" placeholder="Ej. Gabriel García Márquez" required>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <a th:href="@{/admin/authors}" class="btn btn-secondary me-2">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Guardar Autor
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block layout:fragment="page-css"></th:block>
<th:block layout:fragment="page-js"></th:block>
</body>
</html>
