#spring.application.name=Book Store

spring:
  application:
    name: Book Store
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:mysql://localhost:3306/book_store_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
#    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  sendgrid:
    api-key: ${API_KEY_SENDGRID}
    from:
      email: ${EMAIL}
app:
  upload:
    dir: src/main/resources/static/img/
server:
  port: 8080